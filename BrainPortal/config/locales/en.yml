      env_vars_note_bottom: 'Note: More environment variables lines can be added by saving and editing again.'
      env_vars_note_top: In the generated script, the values shown here will be placed in double quotes automatically.
      epilogue_explanation_html: |
        This is a multi line partial BASH script, meant to match the prologue above. The code
        here will be execute after the task's processing code.
        Note that this script MUST be silent, as outputing text (like in <em>echo</em> statements)
        could interfere with the proper processing of the tasks output.
      field_explanations:
        boutiques_path_html: |
          You can use this field to provide an explicit path to a
          Boutiques descriptor; an absolute path will be used as-is,
          while a relative path will be resolved relative to the
          <em>boutiques_descriptor</em> folder in the installed plugins
          subdirectory. The page indicates the source location of the
          effective descriptor: 'Automatic' means the configuration has
          been mapped automatically to an installed descriptor, 'Manual'
          means the value in the input field here is used, and 'Overriden'
          means both values exists, but the 'Manual' version is in effect.
        container_exec_args_html: |
          This field can contain singularity exec command options. Please use appropriate quotation or escaping
          For example, <em>--cleanenv --env MYPATH='/My Documents'</em>.
        container_image_id: |
          The ID number of the container image in which the tool is installed.
          This ID refers to a proper image file registered in CBRAIN by the admin.
        container_image_name: |
          The name and tag of the container image in which the tool is installed,
          for instance "centos:latest". This name refers to the Docker/Singularity index
          accessed by the Bourreau, which is configured manually in the Bourreau
          for now.
        container_index_html: |
          The index (url) of the container image in which the docker or singularity container is
          accessible through.
          Examples for Docker are: quay.io, index.docker.io (default).
          Examples for Singularity are: docker:&sol;&sol;, shub:&sol;&sol; (default).
        description: |
          The first line must be a short summary, and the rest are for any special
          notes for the users.
        extra_qsub_html: "<b>Note:</b>This string will be appended to the extra 'qsub' option defined at the bourreau level.\n"
        inputs_readonly_html: Check this if the tool is known <strong>not to modify its input files </strong>. This will allow a user to launch the tool on files that are not marked as group-writable in the file manager.
        singularity_overlays_html: |
          This field can contain one or several specifications for data overlays and bindmounts
          to be included when the task is started with Singularity.
          <p>
          Each overlay or bindmount specification should be on a separate line.
          <p>
          An overlay specification can be either:
          <p>
          <ul>
          <li>a full path (e.g. <em>file:/a/b/data.squashfs</em>),</li>
          <li>a path with a pattern (e.g. <em>file:/a/b/data*.squashfs</em>),</li>
          <li>a registered file identified by ID (e.g. <em>userfile:123</em>),</li>
          <li>a SquashFS Data Provider identified by its ID or name (e.g. <em>dp:123</em>, <em>dp:DpNameHere</em>)</li>
          <li>or an ext3 capture overlay basename (e.g. <em>ext3capture:basename=SIZE</em> where size is <em>12G</em> or <em>12M</em>).</li>
          </ul>
          <p>
          In the case of a Data Provider, the overlays will be the SquashFS files that the provider uses for its storage. The provider of course must be local to the current execution server.
          <p>
          A bindmount specification is one of:
          <ul>
            <li><em>bindmount:/bourreau/path/to/data:/containerized/path/to/data</em> or</li>
            <li><em>bindmount:/bourreau/path/to/data:/containerized/path/to/data:ro</em></li>
          </ul>
          <p>
          You can add comments, indicated with a hash symbol <em>#</em>.
          For example, <em>file:/a/b/atlas.squashfs # brain atlas</em>
        version: Must be a simple string that represent a short identifier for the version. First character must be alphanum, and can contain only alphanums, '.', '-', '_', ':' and '@'
