      on_execution_server: 'sur le serveur de calcul : '
      optional_destination_dp_html: 'Facultatif : lors de l''archivage <em>comme fichier</em>, choisissez un serveur de stockage de destination :<br />'
      paragraphs:
        archiving_1_html: Ce panneau vous permet d'archiver le contenu du répertoire de travail<br />de vos tâches. Cela ne peut être effectué que pour les tâches dans un état<br />final, comme <strong>Finie</strong>, <strong>Échec</strong> ou <strong>Interrompue</strong>.
        archiving_2_html: Le processus peut prendre beaucoup de temps pour chaque tâche archivée ou restaurée.<br />Veuillez donc patienter et ne demandez pas cette action plusieurs fois en parallèle.
        archiving_3_html: |-
          Il existe deux différents « niveaux » d'archivage :<br/>
          <ul>
            <li class="dropmenu_info">
              L'archivage <em>sur le cluster</em> signifie que les fichiers de la tâche seront compressés et archivés, mais resteront sur le cluster. Ces tâches sont indiquées par le symbole %{workdir_status} dans la table d'index.
            </li>
            <li class="dropmenu_info">
              L'archivage <em>comme fichier</em> signifie que l'archive sera rapatriée dans votre gestionnaire de fichiers sous la forme d'un fichier « %{type} » et qu'aucune donnée ne restera sur le cluster. Ces tâches sont indiquées par le symbole %{userfile_status} dans la table d'index.
            </li>
          </ul>
        archiving_4_html: Le reste des informations sur les tâches ne sera en aucun cas modifié<br />lorsqu'elles seront archivées. Aucune opération ne peut être effectuée sur une tâche archivée, sauf<br />bien entendu sa désarchivage.
        for_completed_tasks_intro_html: 'Ce panneau vous permet d''agir sur les tâches finies avec succès.<br />Vous pouvez essayer de les redémarrer à trois étapes différentes de leur cycle de vie :'
        for_completed_tasks_list_html: "<ul><li>À l'étape <strong>Configuration</strong>, lorsque les fichiers de données d'entrée<br />sont synchronisés sur le serveur de calcul et que les<br />scripts de traitement sont créés.</li><li>À l'étape <strong>Cluster</strong>, lorsque les scripts scientifiques<br />sont exécutés sur les nœuds du serveur de calcul.</li><li>À l'étape <strong>Post-traitement</strong>, lorsque les fichiers de sortie<br/>résultants sont renvoyés vers les fournisseurs de données de CBRAIN.</li></ul>"
        for_completed_tasks_note_html: Vous pouvez également dupliquer des tâches et les recréer sur un autre<br />serveur de calcul. Avant de les redémarrer, assurez-vous toutefois d'ajuster<br />la version de leur outil.
        for_failed_tasks_html: Ce panneau vous permet d'agir sur les tâches ayant échoué, d'une manière ou d'une autre.<br />La tentative de récupération après une erreur déclenchera le code de nettoyage ainsi qu'un redémarrage au<br />dernier stade de traitement réussi avant l'échec. Cela ne fonctionne pas toujours,<br />mais il est souvent utile d'essayer au moins une fois !
        remove_tasks_html: Enfin, vous pouvez supprimer complètement des tâches. Cela effacera le répertoire de travail de la tâche<br />sur le serveur de calcul, y compris les fichiers de données temporaires, mais n'effacera pas<br />les fichiers de sortie d'une tâche finie avec succès. Cela est utile si vous avez,<br />par exemple, des données confidentielles. La suppression d'une tâche <strong>supprimera</strong> également toute<br />archive du répertoire de travail de cette tâche, le cas échéant (comme indiqué par<br />les symboles %{workdir_status} et<br />%{userfile_status} dans la colonne « Taille du répertoire de travail »).
        remove_work_directories_note_html: Il est également possible de supprimer les répertoires de travail des tâches<br />sur le serveur de calcul tout en conservant le reste des<br />informations des tâches. Cela est utile pour libérer de l'espace sur le serveur<br />ou lorsque les tâches ont traité des données confidentielles que<br />vous préférez ne pas laisser sur le serveur. Le panneau <em>Archivage</em><br />à gauche offre d'autres options pour gérer les<br />répertoires de travail des tâches.
        terminating_and_cleaning_up_html: Ce panneau vous permet d'agir sur les tâches dont vous n'avez plus besoin.<br />Vous pouvez interrompre des tâches à n'importe quelle étape de leur cycle de vie, même<br />celles ayant échoué. Les tâches marquées <strong>Interrompue</strong> peuvent être redémarrées<br />ultérieurement.
