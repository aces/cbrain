            la clé avec un éditeur de texte dans le fichier <em>.ssh/authorized_keys</em> sur le système distant.
            Vérifiez que les permissions du dossier <em>.ssh</em> soient 'rwx------' et que celles du fichier <em>authorized_keys</em> soient 'rw-------'.
            <p>
            <strong>Pour les débutants :</strong> pensez à télécharger la clé via le lien ci‑dessous et à la sauvegarder en tant que fichier 'mykey.pub'
