    form_fields:
      container_none: Aucun
      container_type_title: Type de conteneur
      env_vars_note_bottom: 'Remarque : d''autres lignes de variables d''environnement peuvent être ajoutées en enregistrant et en modifiant à nouveau.'
      env_vars_note_top: Dans le script généré, les valeurs affichées ici seront automatiquement entourées de guillemets doubles.
      epilogue_explanation_html: |
        Ceci est un script partiel BASH multi‑ligne, destiné à compléter le prologue ci‑dessus. Le code
        ici sera exécuté après le code de traitement de la tâche.
        Notez que ce script DOIT rester silencieux, car l'affichage de texte (comme avec des commandes <em>echo</em>)
        pourrait interférer avec le traitement correct de la sortie des tâches.
      field_explanations:
        boutiques_path_html: 'Vous pouvez utiliser ce champ pour fournir un chemin explicite vers un descripteur Boutiques ; un chemin absolu sera utilisé tel quel, tandis qu''un chemin relatif sera résolu relativement au dossier <em>boutiques_descriptor</em> dans le sous-répertoire des plugins installés. La page indique l''emplacement source du descripteur effectif : ''Automatic'' signifie que la configuration a été mappée automatiquement sur un descripteur installé, ''Manual'' signifie que la valeur saisie ici est utilisée, et ''Overriden'' signifie que les deux valeurs existent, mais que la version ''Manual'' est en vigueur.

          '
        container_exec_args_html: |
          Ce champ peut contenir des options pour la commande `singularity exec`. Veuillez utiliser les guillemets ou l'échappement appropriés.
          Par exemple, <em>--cleanenv --env MYPATH='/My Documents'</em>.
        container_image_id: |
          Le numéro d'ID de l'image du conteneur dans laquelle l'outil est installé.
          Cet ID fait référence à un fichier image proprement enregistré dans CBRAIN par l'administrateur.
        container_image_name: 'Le nom et le tag de l''image du conteneur contenant l''outil, par exemple "centos:latest". Ce nom fait référence à l''index Docker/Singularity accessible depuis le serveur de calcul, qui est configuré manuellement sur celui-ci pour l''instant.

          '
        container_index_html: |
          L'index (URL) où l'image du conteneur est disponible.
          Exemples pour Docker : quay.io, index.docker.io (par défaut).
          Exemples pour Singularity : docker://, shub:// (par défaut).
        description: 'La première ligne doit être un court résumé, le reste servant pour des notes particulières destinées aux utilisateurs.

          '
        extra_qsub_html: "<b>Remarque :</b> Cette chaîne sera ajoutée à l'option supplémentaire 'qsub' définie au niveau du serveur de calcul.\n"
        inputs_readonly_html: |
          Cochez ceci si l'outil est connu pour <strong>ne pas modifier ses fichiers d'entrée</strong>.
          Cela permettra à un utilisateur de lancer l'outil sur des fichiers qui ne sont pas marqués comme modifiables par le groupe dans le gestionnaire de fichiers.
        singularity_overlays_html: |
          Ce champ peut contenir une ou plusieurs spécifications pour des overlays de données et des bindmounts à inclure lors du démarrage d'une tâche avec Singularity.
          <p>
          Chaque spécification d'overlay ou de bindmount doit être sur une ligne séparée.
          <p>
          Une spécification d'overlay peut être :
          <p>
          <ul>
          <li>un chemin complet (ex. <em>file:/a/b/data.squashfs</em>),</li>
          <li>un chemin avec motif (ex. <em>file:/a/b/data*.squashfs</em>),</li>
          <li>un fichier enregistré identifié par ID (ex. <em>userfile:123</em>),</li>
          <li>un Serveur de Stockage SquashFS identifié par son ID ou son nom (ex. <em>dp:123</em>, <em>dp:NomDP</em>),</li>
          <li>ou un basename d'overlay ext3capture (ex. <em>ext3capture:basename=SIZE</em> où SIZE est <em>12G</em> ou <em>12M</em>).</li>
          </ul>
          <p>
          Dans le cas d'un Serveur de Stockage, les overlays seront les fichiers SquashFS utilisés par le fournisseur pour son stockage. Le fournisseur doit bien sûr être local au serveur de calcul.
          <p>
          Une spécification de bindmount est l'une des formes suivantes :
          <ul>
            <li><em>bindmount:/chemin/du/bourreau/vers/donnees:/chemin/dans/conteneur</em> ou</li>
            <li><em>bindmount:/chemin/du/bourreau/vers/donnees:/chemin/dans/conteneur:ro</em></li>
          </ul>
          <p>
          Vous pouvez ajouter des commentaires indiqués par un symbole dièse <em>#</em>.
          Par exemple, <em>file:/a/b/atlas.squashfs # atlas cérébral</em>
        version: Doit être une chaîne simple représentant un identifiant court pour la version. Le premier caractère doit être alphanumérique, et la chaîne ne peut contenir que des caractères alphanumériques, '.', '-', '_', ':' et '@'.
