      paragraphs:
        persistent_ssh_explanation: Lorsqu'il est réglé sur 'toujours', les connexions SSH vers l'hôte d'un data provider persistent après la première utilisation. Cela rend les transferts de données successifs un peu plus rapides car la connexion n'a pas besoin d'être rouverte à chaque fois. Le comportement par défaut est activé ('toujours') pour les portails et désactivé ('jamais') pour les bourreaux.
        reverse_service_defaults_html: Certaines <strong>valeurs par défaut</strong> affichées sous les zones de saisie sont des <em>estimations</em> basées sur le portail actuellement en cours d'exécution. Elles sont utiles si le portail est justement le serveur vers lequel se reconnecter.
        reverse_service_description_html: Ceci est un mécanisme alternatif pour fournirau Bourreau une connexion distincte à la base de données et à l'agent SSH.Pour que cela fonctionne, un serveur accessible en SSH (fourni par nom d'hôte,numéro de port et nom d'utilisateur) doit être configuré pour accepter laclé principale du portail CBRAIN, et être visible depuis le Bourreau. Ceserveur doit disposer d'un agent SSH fournissant des clés sur un socketde domaine UNIX, et d'une connexion de base de données pour CBRAIN. La spécificationde la connexion à la base de données peut être fournie soit comme chemincomplet vers un socket de domaine UNIX, soit comme <em>localhost:port</em>.
