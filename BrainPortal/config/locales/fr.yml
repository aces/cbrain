      legends:
        allowed: autorisé
        not_allowed: non autorisé
        title: 'Copier ou déplacer des fichiers :'
      paragraphs:
        intro_html: |
          <p class="medium_paragraphs">
            Ce tableau montre quels transferts de fichiers sont autorisés entre serveurs de stockage. Chaque cellule du tableau contient deux symboles, où %{ok} signifie <em>autorisé</em> et %{no} signifie <em>non autorisé</em>. Les transferts réussiront si <strong>les deux</strong> symboles apparaissent comme %{ok}&nbsp;%{ok}.
          </p>
          <p class="medium_paragraphs">
            Le premier symbole indique les restrictions pour le transfert de fichiers entre paires de serveurs de stockage, indépendamment de l'état d'autres ressources. Les restrictions ne sont pas nécessairement symétriques : il est possible de configurer A -> B autorisé (%{ok}) alors que B -> A ne l'est pas (%{no}).
          </p>
          <p class="medium_paragraphs">
            Le second symbole tient compte de trois autres facteurs :
            <ul>
              <li>si les serveurs de stockage sont <em>en ligne</em> ou <em>hors ligne</em> ;</li>
              <li>si les serveurs de stockage sont <em>lecture/écriture</em> ou <em>lecture seule</em> ;</li>
              <li>si le portail courant a lui‑même accès à chaque serveur de stockage.</li>
            </ul>
            Dans de tels cas, les serveurs de stockage seront annotés avec %{offline}, %{read_only} et/ou %{no_access}. Si les trois propriétés permettent le transfert, le second symbole sera %{ok} ; sinon il sera %{no}.
          </p>
      title: Restrictions de transfert
