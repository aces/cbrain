      notesbody_html: |
        <div id="notesbody" class="notesbox" style="display:none">

            <h3>Quelques notes sur la configuration d'un bourreau</h3>

            Un bourreau est une application Rails distante utilisée par le BrainPortal. Comme toutes les applications Rails, elle tourne sur un hôte quelque part, écoute des connexions HTTP sur un port et doit se connecter au même serveur de base de données que le BrainPortal.

            <p>

            Contrairement au BrainPortal, les connexions HTTP qu'elle attend ne proviennent pas du navigateur d'un utilisateur, mais sont des requêtes XML émises par le BrainPortal via un protocole Rails appelé ActiveResource. Il existe plusieurs manières d'indiquer au BrainPortal comment se connecter au bourreau et le gérer, ce qui explique tous les champs de ce formulaire.

        </div>
