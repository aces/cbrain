    view_buttons:
      paragraphs:
        admin_only_html: '<p class="medium_paragraphs">Administrateurs seulement</p>

          '
        description_html: |
          <div class="medium_paragraphs">
            Un projet permet de regrouper sous un même nom un ensemble
            de fichiers et de tâches CBRAIN. Un projet <em>n'est pas un dossier</em>.
            Passer à un projet le rend 'actif'. Lorsqu'un
            projet est actif, un filtre implicite automatique sera appliqué
            de sorte que seuls les fichiers et tâches assignés au projet sera affichés
            dans le gestionnaire de fichiers ou de tâches.
          </div>
        my_private_projects_html: |
          <p class="medium_paragraphs">
            Ces projets sont visibles uniquement par vous. Il existe un projet particulier
            nommé <strong>%{name}</strong> créé automatiquement
            par le système pour vous par défaut, et qui ne peut pas être supprimé. Chacun
            de ces projets peut devenir un projet partagé en invitant d'autres
            utilisateurs à le rejoindre. Dans ce cas, les projets apparaîtront dans un onglet séparé.
          </p>
        my_shared_projects_html: |
          <p class="medium_paragraphs">
            Ce sont des projets que vous avez créés et qui sont partagés avec d'autres utilisateurs.
            Les fichiers et tâches assignés à un projet sont visibles par tous les membres de ce projet.
          </p>
        other_projects_html: |
          <p class="medium_paragraphs">
            Projets qui, pour une raison quelconque, ne sont pas assignés à d'autres onglets
          </p>
        projects_shared_with_me_html: |
          <p class="medium_paragraphs">
            Ce sont des projets créés par d'autres utilisateurs qui vous ont invité à les rejoindre.
            Les fichiers et tâches assignés à un projet sont visibles par tous les membres de ce projet.
          </p>
        public_projects_html: |
          <p class="medium_paragraphs">
            Ce sont des projets publics. Tous les fichiers et tâches qui leur sont assignés sont visibles par tous les utilisateurs !
          </p>
        site_projects_html: |
          <p class="medium_paragraphs">
            Ce sont des projets de site. Ils peuvent être utilisés pour partager fichiers et tâches entre l'ensemble des utilisateurs
            appartenant au Site associé.
          </p>
        special_all_project_html: |
          <p class="medium_paragraphs">
            Ce projet spécial <strong>TOUS</strong> n'est en fait pas un
            projet. Le sélectionner comme projet 'actif'
            désactivera tout filtrage par projet, vous permettant de voir
            ensemble <strong>tous</strong> les fichiers et tâches.
            Le gestionnaire de fichiers et le gestionnaire de tâches afficheront une nouvelle
            colonne où vous pourrez filtrer par projet directement.
            Sélectionner le projet <strong>TOUS</strong> est utile lorsque vous devez gérer ou parcourir des fichiers et tâches
            répartis dans plusieurs projets.
          </p>
