      paragraphs:
        creator_html: |
          <div class="field_explanation">
            <span class="warning">Attention</span> : Si vous changez le responsable pour une autre personne, vous ne pourrez plus modifier ce projet
          </div>
        description_html: |
          <div class="field_explanation">
            La première ligne doit être un résumé court, le reste servant pour des détails.
          </div>
        not_assignable_html: |
          <div class="field_explanation">
            Si coché, les membres normaux ne pourront pas assigner de fichiers ou autres
            ressources de ce projet (mais les éditeurs le peuvent toujours).
          </div>
        public_html: |
          <div class="field_explanation">
            Si coché, un projet public rend tous ses fichiers visibles à tous les utilisateurs. <span class="warning">Soyez prudent</span>
            avec cette option !
          </div>
        invisible_html: |
          <div class="field_explanation">
            Si coché, le projet ne sera pas affiché dans la liste des projets.
          </div>
        track_usage_html: |
          <div class="field_explanation">
            Si coché, le système suivra l'utilisation globale des fichiers dans ce projet
            (vues, téléchargements, etc.) par mois.
          </div>
