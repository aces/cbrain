        description_html: |
          <div class="field_explanation">
            La première ligne doit être un résumé court, le reste servant pour des détails.
          </div>
        invisible_html: |
          <p>
          Rendre ce groupe système invisible pour les utilisateurs normaux :
        track_usage_html: |
          <p>
          Activer le suivi d'utilisation pour les fichiers de ce projet :
        not_assignable_html: |
          <p>
          Les membres normaux ne pourront pas assigner de fichiers ou autres ressources
          à ce projet (mais les éditeurs le peuvent toujours) :
        public_html: |
          <p>
          Rendre le projet public, de sorte que tous les utilisateurs puissent accéder aux fichiers. Soyez prudent avec cette option ! Vous pouvez toujours rendre le projet public plus tard :
