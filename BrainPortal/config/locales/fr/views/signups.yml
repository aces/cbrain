      paragraphs:
        title_html: |
          <div class="wide_field_explanation">
            <span class="wide_field_explanation">par exemple : « Mme », « M. », « Dr », etc.</span>
          </div>
        login_html: |
          <div class="wide_field_explanation">
            <span class="wide_field_explanation">
                <small>une lettre + des alphanumériques. <strong>Par convention</strong> : première lettre du prénom + nom de famille.
                Par exemple, pour John Doe : 'jdoe' </small>
            </span>
          </div>
        email_html: |
          <div class="wide_field_explanation">
            <small>Veuillez fournir l'adresse de <strong class="warning">votre institution de recherche.</strong>
              Les demandes avec une adresse non institutionnelle seront <strong>ignorées</strong>
            </small>
          </div>
        comment_html: |
          <div class="wide_field_explanation">
            Veuillez indiquer le nom du laboratoire où vous travaillez,
            le nom du chercheur principal (si ce n'est pas vous), et si possible
            quelqu'un d'autre de votre laboratoire déjà utilisateur de CBRAIN. <br>
            Nous utiliserons ces informations pour créer ou vous ajouter à un
            <em>Site</em> dans CBRAIN.
          </div>
        privacy_note: |
          <br>
          <b>Note de confidentialité</b>
          <br>
          Les informations que vous fournissez dans ce formulaire sont
          utilisées uniquement pour examiner votre demande et, <br> une fois approuvée,
          pour générer automatiquement votre compte utilisateur. <br>
          Ces informations ne seront pas utilisées à d'autres fins ni transmises
          à d'autres entités ou personnes.
