    confirm_button:
      title: "Confirmez votre demande"
      headings:
        main: "Veuillez confirmer votre demande de nouveau compte."
      paragraphs:
        main_html: |
          Merci d'avoir suivi le lien envoyé par CBRAIN dans votre boîte mail.
          <p>
          Pour nous assurer que vous êtes bien le propriétaire de l'adresse e-mail ayant
          demandé la création d'un compte CBRAIN, veuillez compléter l'étape finale en cliquant
          sur le bouton ci‑dessous. Cela informera les administrateurs de CBRAIN que votre demande est légitime et officielle.
          <p>
      links:
        confirm_request: "Confirmer la demande"

    confirm:
      title: "Demande confirmée"
      headings:
        main: "Confirmé !"
      links:
        have_a_look: "consulter"
      paragraphs:
        main_html: |
          Merci. Vous avez confirmé votre adresse e‑mail.
          <p>
          À présent, les administrateurs vont examiner votre demande
          et vous serez notifié si et quand elle sera approuvée.
          <p>
        propose_view_html: |
          En attendant, vous pouvez %{look} votre demande, ou même la %{edit}.
        footer: |
          (Il n'y a rien d'autre à faire ici, profitez-en pour prendre un café et lire les nouvelles)

