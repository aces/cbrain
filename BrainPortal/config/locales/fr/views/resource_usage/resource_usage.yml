fr:
  resource_usage:

    common:
      task_walltime: "Temps d'exécution (walltime)"
      task_cpu_time: "Temps CPU de la tâche"
      task_final_status: "Statut final de la tâche"

    index:
      title: "Utilisation des ressources"

    resource_usage_table:
      title:
        file_deltas: "Variations de fichiers"

      buttons:
        userfile_disk_space: "Espace disque des fichiers utilisateur"

      legends:
        table_description: "Description du tableau"
        usage_summary: "Résumé d'utilisation (y compris filtres)"
        additional_filtering: "Filtrage additionnel"

      paragraphs:
        description_intro_html: |
          <p class="medium_paragraphs">
          Il s'agit d'un tableau de rapport <em>très large</em>. Il contient
          des enregistrements d'utilisation des ressources pour l'espace disque et le temps consommé.
          N'hésitez pas à masquer des colonnes en utilisant le menu <strong>+</strong>
          situé à droite de l'en-tête principal du tableau.
        description_space_userfile_html: |
          Il affiche les <span style="color: green">variations de taille</span> de tous les fichiers,
          existants ainsi que supprimés.
        description_cputime_html: |
          Il affiche le <span style="color: green">temps CPU</span> accumulé par les tâches.
        description_walltime_html: |
          Il affiche le <span style="color: green">(walltime)</span> accumulé par les tâches.
        description_space_task_html: |
          Il affiche le <span style="color: green">espace disque</span> dans le répertoire de travail,
          ainsi que le <span style="color: green">statut final</span> des tâches passées. L'espace disque
          n'est pas garanti comme précis, car il s'agit d'une ressource coûteuse à calculer
          et fournie uniquement à titre informatif. Le but principal de ce rapport est de recueillir des statistiques sur le
          <strong>statut</strong> final des tâches.
        description_cached_html: |
          <p class="medium_paragraphs">
          Les colonnes étiquetées <strong>Cached</strong> enregistrent des informations
          sur les ressources <em>telles qu'elles étaient au moment où l'enregistrement a été fait</em>.
          Si une ressource a été détruite (par ex. une colonne non-<strong>Cached</strong> est vide), ces informations restent
          et permettent des options de filtrage. Cela rend possible la collecte de statistiques sur
          ces ressources supprimées.

      labels:
        only_deleted_items: "Uniquement les éléments supprimés"
        positive_size_delta: "Avec variation de taille positive"
        negative_size_delta: "Avec variation de taille négative"
        task_type: "%{label} (de %{base})"

      submits:
        refresh_table: "Rafraîchir le tableau"

