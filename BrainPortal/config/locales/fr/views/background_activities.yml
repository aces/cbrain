      legends:
        about: "À propos des activités en arrière-plan"

      paragraphs:
        about_general_top_html: |
          <p class="long_paragraphs">
          Cette page affiche les « activités en arrière-plan » sous forme de barres de progression. Chaque
          activité applique une opération unique à un ensemble d'éléments (généralement,
          des fichiers ou des tâches). Ces activités résultent souvent du clic
          sur des boutons dans d'autres pages, lorsque vous recevez un message indiquant <em>qu'une action
          a été lancée en arrière-plan</em>. Les activités en cours
          sont affichées avec des bordures lumineuses. Les opérations individuelles au sein d'une
          activité peuvent réussir ou échouer. Parfois, l'échec n'est pas
          significatif (par ex. tenter de compresser un fichier déjà compressé).
          <p class="long_paragraphs">
          Vous pouvez annuler des activités, mais rappelez-vous que les activités annulées
          ne peuvent jamais être relancées. Vous devrez refaire l'opération
          qui a créé l'activité.
          <p class="long_paragraphs">
          Les anciennes activités terminées sont généralement supprimées après une semaine et disparaîtront de cette liste.
        about_admin_html: |
          <p class="long_paragraphs">
          En tant qu'administrateur, vous pouvez créer des activités de maintenance qui peuvent être
          planifiées pour plus tard. Consultez le formulaire associé pour plus d'aide. Vous
          pouvez également suspendre des activités ; celles-ci sont reprises ensuite. Vous pouvez suspendre
          des activités en cours ou planifiées dans le futur.
        about_general_bottom_html: |
          <p class="long_paragraphs">
          Les barres de progression de cette page ne sont <strong>pas en direct</strong>, il
          faut cliquer sur le bouton <em>Rafraîchir</em> pour obtenir une mise à jour
          de l'avancement de vos activités.

