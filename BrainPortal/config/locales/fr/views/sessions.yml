fr:
  sessions:

    mandatory_oidc:
      title: "Liaison obligatoire avec un fournisseur d'identité"
      headings:
        before_message_html: "Avant de pouvoir continuer, votre compte CBRAIN <em>doit</em> être lié à un fournisseur d'identité."
        explanations: "Explications"
        allowed_providers: "Les fournisseurs d'identité autorisés pour votre compte sont :"

      paragraphs:
        explanations: |
          <p class="short_paragraphs">
          Lorsque vous cliquerez sur le bouton ci-dessous, votre navigateur
          sera redirigé vers une page de connexion d'un fournisseur d'identité,
          où vous pourrez choisir l'un des fournisseurs d'identité pris en charge.
          Vous serez ensuite redirigé vers la page de connexion du fournisseur sélectionné.
          Une fois votre authentification réussie, votre navigateur sera redirigé vers
          cette page afin de finaliser la liaison avec votre compte CBRAIN.
          </p>
        no_provider: |
          <p class="short_paragraphs">
          Aucun fournisseur d'identité n'est actuellement disponible pour votre compte.
          Veuillez communiquer avec l'administrateur de CBRAIN pour obtenir de plus amples renseignements.
          </p>
        already_logged_in: |
          <p class="short_paragraphs">
          Si vous êtes déjà connecté à l'aide d'un autre fournisseur d'identité,
          vous devriez d'abord vous déconnecter. Vous pouvez le faire en cliquant sur le bouton ci-dessous :
          </p>

      any_provider: "(N'importe quel fournisseur d'identité)"

      links:
        login_with: "Se connecter avec %{name}"
        logout_from: "Se déconnecter de %{name}"

    new:
      title: "Se connecter"

      divs:
        only_available_html: |
          <div class="field_explanation">
            (Disponible uniquement si vous avez déjà associé votre<br>
            compte CBRAIN à une identité %{name})
          </div>
      labels:
        login: "Se connecter"
        password: "Mot de passe"

      submit:
        sign_in: "Se connecter"

      links:
        forgot_password: "Mot de passe oublié?"
        sign_in_with: "Se connecter avec %{name}"
        request_account: "Demander un compte"
        full_list: "Liste complète de tous les outils et jeux de données"

      or: "OU"
      not_a_user: "Vous n'avez pas de compte?"
