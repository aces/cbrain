fr:
  descriptor_maker_help:
    title: "Créateur de descripteurs Boutiques"
    intro: "Ce formulaire permet de concevoir et de visualiser un descripteur Boutiques pour une tâche."
    syntax: "Le descripteur est au format JSON et sa syntaxe est très stricte."
    sample: "Vous commencez avec un exemple de descripteur contenant cinq entrées (un fichier, une chaîne de caractères, un nombre, un indicateur et une liste de sélection)."
    check_html: "Ajoutez les entrées et les métadonnées nécessaires, puis cliquez sur <strong>Vérifier le descripteur</strong> pour actualiser cette page et valider le descripteur."
    validation_html: "Si la syntaxe du descripteur est valide, <em>bosh</em> le validera à nouveau et les messages seront affichés ci-dessous. Si cette étape réussit également, un exemple de la commande générée sera affiché à partir du contenu du formulaire situé en dessous."
    values_html: "Vous pouvez saisir des valeurs dans le formulaire généré pour voir leurs effets sur la validation et la ligne de commande. <strong>Remarque :</strong> le formulaire affiche les entrées de la vérification précédente ; il peut donc être nécessaire de cliquer deux fois sur <strong>Vérifier le descripteur</strong> pour synchroniser les données envoyées avec les entrées du descripteur."
    reset: "Vous pouvez revenir à l’exemple initial à tout moment en effaçant entièrement le contenu de la zone de texte du descripteur JSON."
    recommendations: "Recommandations"
    name: "Saisissez un nom d’outil sans espaces ni caractères spéciaux, par exemple \"Brainmangler\" ou \"SuperConfabulator\"."
    version: "Le champ 'tool-version' doit également contenir une chaîne de caractères valide."
    author: "Les champs 'author' et 'descriptor-url' identifient l’auteur de l’outil. Saisissez plutôt votre propre nom dans la section custom → 'cbrain:author'."
    more: "Informations complémentaires"
    spec_html: "La spécification complète de Boutiques est disponible sur %{link}."
    resources: "Autres ressources :"
    schema: "Schéma JSON complet"
    examples: "Exemples"
    schema_source_html: "%{link} du projet Boutiques."
    examples_source_html: "%{link} du projet Boutiques."
    traditional_html: "%{link} des plugins CBRAIN Neuro avec des descripteurs traditionnels."
    extensions_html: "%{link} des plugins CBRAIN Neuro avec les extensions de comportement propres à CBRAIN."
