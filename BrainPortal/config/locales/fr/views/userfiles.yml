          (Ce fichier ne peut pas être consulté car il est stocké sur le fournisseur de données
          %{dp_link}
          qui est marqué comme <strong>non consultable</strong>)
        not_syncable_dp_html: |
          (Ce fichier ne peut pas être consulté car il est stocké sur le fournisseur de données
          %{dp_link}
          qui est configuré pour <strong>n'autoriser aucune synchronisation</strong> <em>du tout</em>)
        corrupted_html: |
          <span style="background-color: pink;">
            (Le contenu de ce fichier semble être corrompu. Cela peut être dû
            à un mauvais transfert de données lors de sa création ou à une défaillance du système de fichiers.
            Il n'y a pas grand-chose que vous puissiez faire à ce sujet, mais si le fichier a été produit
            par une tâche, envisagez de redémarrer l'étape de post-traitement de la tâche.)
          </span>
        sync_not_allowed_html: |
          (Ce fichier ne peut pas être consulté car il est stocké sur le fournisseur de données
          %{dp_link}
          qui est configuré pour <strong>ne pas autoriser la synchronisation</strong> vers <em>ce portail</em>)
        offline_dp_html: |
          (Ces données ne sont actuellement pas synchronisées et leur fournisseur de données
          %{dp_link}
          est hors ligne. Leur contenu ne peut donc pas être consulté pour le moment)
        sync_in_progress: "(Ce fichier de données est actuellement en cours de synchronisation. Attendez quelques secondes pour que le processus soit terminé)"
        sync_start_html: |
          (Ce fichier de données n'est actuellement pas synchronisé. Cliquez sur
          %{link}
          pour commencer le processus de synchronisation.
          Cela peut vous permettre de consulter le contenu affichable.)
        sync_start_collection_html: |
          (Ce fichier de données n'est actuellement pas synchronisé. Cliquez sur
          %{link}
          pour commencer le processus de synchronisation.
          Cela peut vous permettre de consulter le contenu affichable et d'extraire des fichiers de cette collection.)
        no_viewer_code_html: |
          (Le contenu de ce fichier ne peut pas être consulté: aucun code de visionneuse n'est actuellement disponible
          pour les fichiers de type '%{type}')
