    provenance:
      title: "Provenance"

      headings:
        statement: "Déclaration de provenance de CBRAIN"

      paragraphs:
        statement_html: |
          Les nouvelles fonctionnalités et les corrections de bogues sont testées
          et intégrées à la branche de développement dès leur achèvement.
          Des tests d'intégration continue sont exécutés de façon automatisée et
          s'appliquent à tout le code intégré au dépôt de développement.
          Toutes les demandes d'extraction sont examinées et validées par l'équipe principale
          de développement avant d'être soit acceptées, soit retournées au développeur
          auteur de la soumission afin qu'il puisse effectuer des modifications et des tests supplémentaires.

          <p>

          Les versions majeures sont publiées afin de regrouper des ensembles
          de corrections de bogues, de correctifs et de nouvelles fonctionnalités
          jugés bénéfiques pour une diffusion sous la forme d'une version cumulative
          et intégrée destinée à la communauté. Les versions majeures sont préparées
          par le développeur principal de CBRAIN et autorisées conjointement
          avec le directeur de l'équipe CBRAIN.

          <p>

          Chaque version est accompagnée de notes de version décrivant clairement
          les nouvelles fonctionnalités ainsi que les problèmes corrigés dans cette version.

          <p>

          Les <a href="https://github.com/aces/cbrain/blob/master/Release-Notes.md">notes de version</a>
          sont disponibles dans le dépôt GitHub de CBRAIN.

          <p>

      footer:
        last_updated_html: "<small>Dernière mise à jour du document: %{date}</small>"

    report:
      title: "Rapports tabulaires"

      headings:
        main: "Générateur automatique de rapports tabulaires"

      paragraphs:
        steps_html: |
          <p class="medium_paragraphs">
          Ce formulaire vous permet de générer de nombreux types de rapports
          sous forme de tableaux. Procédez comme suit:
          </p>

          <ul>
            <li><strong>Sélectionnez le type de rapport</strong> dans la zone grise.
                La plupart des rapports comptabilisent le nombre d'objets auxquels
                vous avez accès, mais certains effectuent la somme de certains attributs.
            </li>
            <li><strong>Cliquez sur "Recherchez les colonnes et les lignes"</strong>et le formulaire
            sera mis à jour afin de vous indiquer les attributs que vous pouvez sélectionner
            pour les lignes et les colonnes de votre tableau.
            </li>
            <li><strong>Sélectionnez un attribut pour les lignes et les colonnes</strong> à l'aide de chacune
                des listes de sélection affichées en haut et à gauche de la zone du tableau.
            </li>
            <li><strong>Cliquez sur "Générer le rapport"</strong> et le tableau sera créé avec
                des liens vers les pages d'index correspondantes de vos objets. Vous pouvez
                modifier les propriétés du rapport et le régénérer à tout moment.
            </li>
          </ul>

