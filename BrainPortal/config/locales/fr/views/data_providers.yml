    register_button:
      paragraphs:
        register_html: |
          <p class="medium_paragraphs">
          Ce panneau vous permet d' <strong>enregistrer</strong> des fichiers présents
          sur le serveur distant mais encore inconnus de l'interface CBRAIN.
          Une fois enregistrés, les fichiers seront visibles dans
          le gestionnaire de<strong>Fichiers</strong>, et pourront être utilisés pour lancer
          des tâches.
          </p>

          <p class="medium_paragraphs">
          Nous recommandons d'utiliser ce serveur uniquement pour
          transférer des données vers et depuis CBRAIN. Lors de l'enregistrement,
          comme vous pouvez le voir ci‑dessous, vous pouvez les faire automatiquement déplacer
          ou copier vers un autre serveur officiel CBRAIN.
        must_move_html: |
          <strong>Ce serveur ne vous laisse pas le choix</strong>
          et vous DEVEZ sélectionner un autre serveur vers lequel vos fichiers seront copiés ou déplacés.
        cleanup_html: |
          Une fois les fichiers copiés vers un autre serveur officiel, nous recommandons
          de nettoyer les fichiers ici en utilisant le panneau <strong>Delete Files</strong>, situé plus à droite.
      headings:
        when_registering: "Lors de l'enregistrement, automatiquement..."
      datas:
        assign_project: "Affecter les fichiers à un projet"
        move_or_copy: "Déplacer ou copier les fichiers"
        to: "vers"
        move_option: "... DÉPLACER les fichiers vers le serveur ->"
        copy_option: "... COPIER les fichiers vers le serveur ->"
        do_nothing: "... ne rien faire d'autre !"
      tool_tips:
        info: "(info)"
      include_blanks:
        select_project: "(Sélectionner un projet)"
        select_another_dp: "(Sélectionner un autre serveur de stockage)"
      notes:
        title_html: "<strong>Remarques importantes sur la copie et le déplacement automatiques de fichiers :</strong>"
        start: "L'opération de MOVE ou COPY commencera en arrière-plan dès que vous cliquerez sur 'Register files'."
        no_modify: "Pendant que l'opération est en cours, ne modifiez pas les fichiers sur le serveur de stockage distant !"
        copy_progress_html: "<strong>Lorsqu'une opération de COPY est en cours</strong>, il semblera y avoir deux versions enregistrées du fichier dans le gestionnaire de fichiers (une pour chaque serveur de stockage)."
        copy_done_html: "<strong>Après la fin d'une opération de COPY</strong>, les fichiers resteront visibles ici et ne sembleront plus être enregistrés."
        move_done: "Après la fin d'une opération de MOVE, les fichiers auront été effacés d'ici."
        ignored: "Les tentatives de COPY ou MOVE vers des serveurs de stockage où des fichiers portant le même nom existent déjà seront ignorées silencieusement."
      button: "Enregistrer les fichiers"
      submit: "Enregistrer les fichiers !"

    show_user_key:
      headings:
        instructions: "Instructions de configuration de la clé SSH"
        your_key: "Votre clé SSH publique CBRAIN personnelle"
      paragraphs:
        ssh_configuration_html: |
          <tr><td class="left_align medium_paragraphs">
            La zone ci‑dessous affiche votre clé SSH publique personnelle que le système CBRAIN utilisera
            pour se connecter à votre serveur de stockage. Il s'agit d'une seule ligne de texte à installer
            dans votre répertoire personnel sur la machine distante configurée pour votre serveur de stockage.
            <p>
            <strong>Pour les experts :</strong> si vous maîtrisez déjà ce type de configuration, vous pouvez simplement couper-coller
            la clé avec un éditeur de texte dans le fichier <em>.ssh/authorized_keys</em> sur le système distant.
            Vérifiez que les permissions du dossier <em>.ssh</em> soient 'rwx------' et que celles du fichier <em>authorized_keys</em> soient 'rw-------'.
            <p>
            <strong>Pour les débutants :</strong> pensez à télécharger la clé via le lien ci‑dessous et à la sauvegarder en tant que fichier 'mykey.pub'
            sur votre ordinateur. Ensuite, dans un shell bash, exécutez la commande 'ssh-copy-id' comme expliqué ci‑dessous ; elle se connectera automatiquement à la machine distante
            et installera la clé pour vous. La commande complète est :<p>
          </td></tr>
        no_security_risk_html: |
          <tr><td class="left_align medium_paragraphs">
            Notez que révéler le contenu de cette clé à d'autres personnes ne présente pas de risque de sécurité.
            Les informations contenues dans cette clé sont publiques et ne permettent pas d'accéder à vos données.
          </tr></td>
      errors:
        fetching: "Erreur lors de la récupération de la clé publique"
      links:
        download: "Lien de téléchargement :"

    unregister_button:
      button: "Désenregistrer les fichiers"
      paragraphs:
        unregister_html: |
          <p class="medium_paragraphs">
            Ce panneau vous permet de <strong>désenregistrer</strong> des fichiers présents
            sur le serveur de stockage distant et qui ont déjà été enregistrés par
            l'interface CBRAIN. Une fois désenregistré, un fichier ne sera plus
            visible dans le gestionnaire <strong>Fichiers</strong>, mais restera
            sur le disque du site distant. Vous devrez supprimer les données manuellement
            si vous avez un accès externe aux fichiers distants, ou vous pouvez utiliser le panneau <strong>Supprimer les fichiers</strong>
            indiqué plus à droite.
          </p>
      submit: "Désenregistrer les fichiers !"

