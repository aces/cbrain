        description_html: |
          <div class="field_explanation">
            Cela contrôle quels utilisateurs dans CBRAIN peuvent voir et accéder aux fichiers sur votre stockage. Le projet par défaut et recommandé est votre projet privé, '#{group}'.
          </div>
        group_html: |
            <div class="field_explanation">
              Cela contrôle quels utilisateurs dans CBRAIN peuvent voir et accéder aux fichiers sur votre stockage. Le projet par défaut et recommandé est votre projet privé, '#{group}'.
            </div>
        before_ssh_dp: |
          Utilisez ce type :
        ssh_dp_html: |
          <p class="medium_paragraphs">

            Un serveur de stockage SSH se connecte à un serveur UNIX via SSH et
            transfère des fichiers en utilisant la commande 'rsync' et parfois
            d'autres commandes basiques comme "mkdir", en mode non interactif. Pour que cela
            fonctionne, vous devez vous assurer que :

            <p>

            <ul>
              <li>Le compte utilisateur sur l'hôte distant a un 'shell propre'.<br>
              Cela signifie qu'en connexion non interactive, aucun message
              n'est affiché sur stdout ou stderr.<br>
              Pour plus d'informations, consultez votre administrateur système.
              <li>Vous avez installé une clé SSH dans ce compte ; voir le panneau au bas de ce formulaire.
              <li>L'hôte distant n'est pas derrière un pare‑feu ou un mécanisme d'authentification à deux facteurs.
            </ul>

            <p>
        s3_dp_html: |
          <p>

          Fournissez les informations nécessaires pour vous connecter à un bucket compatible S3.

          <p>

