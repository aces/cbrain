      paragraphs:
        rr_access_explanation_html: |
          <p class="medium_paragraphs">
          Cette page montre quels Serveurs (lignes) peuvent accéder à quels Data Providers (colonnes).
          </p>
          <p class="medium_paragraphs">
          Si vous souhaitez lancer des tâches sur un bourreau particulier, assurez-vous qu'il est
          configuré pour accéder aux fichiersdes serveurs de stockage marqués par des cercles verts (&nbsp;%{o_icon}&nbsp;).
          </p>
          <p class="medium_paragraphs">
          Les Data Providers identifiés sous leur nom par %{not_syncable}
          indiquent que leurs fichiers peuvent encore être accédés via des API de streaming, mais ne pourront jamais être entièrement
          synchronisés sur un serveur.
          </p>
          <p class="medium_paragraphs">
          Les cellules marquées par %{no_access}
          indiquent des serveurs qui ne sont pas autorisés à accéder aux fichiers du Data Provider
          de quelque manière que ce soit (streaming ou synchronisation), même si le Data Provider semble en vie.
          </p>
