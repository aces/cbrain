          activity_workers: "1a. Arrêter les Activity Workers"
          task_workers: "1b. Arrêter les Task Workers"
          execution_server: "2. Arrêter le bourreau"
          tunnels: "3. Arrêter les tunnels"

      dropdowns:
        start_services: "Démarrer les services"
        stop_services: "Arrêter les services"

      confirms:
        stop:
          activity_workers: "Êtes-vous sûr de vouloir arrêter les bourreaux ? Ils termineront d'abord ce qu'ils sont en train de faire."
          task_workers: "Êtes-vous sûr de vouloir arrêter les Task Workers ? Ils termineront d'abord ce qu'ils sont en train de faire."
          bourreau: "Êtes-vous sûr ? Notez que les exécuteurs s'arrêteront également une fois leur travail terminé, s'ils sont encore actifs."
          tunnels: "Assurez-vous que les bourreaux, les Task Workers et les Activity Workers sont tous arrêtés !"

      # Start services panel
      # Panneau démarrage des services
      start_services:
        paragraphs:
          introduction_html: |
            <p class="dropmenu_info">
              Ces boutons démarrent les différentes couches de services nécessaires au démarrage
              d'un bourreau. Elles sont listées dans le même ordre dans lequel elles
              doivent être lancées. Les trois premiers boutons
              ne s'appliquent qu'aux bourreaux, tandis que <strong>Démarrer les Activity Workers</strong>
              s'applique à la fois aux bourreaux et aux portails.
            </p>
            <p class="dropmenu_info">
              Reportez‑vous aux quatre dernières colonnes du tableau pour savoir quels services
              sont actuellement opérationnels. Les quatre boutons de ce panneau correspondent
              à ces colonnes dans le même ordre.
            </p>
            <p class="dropmenu_info">
              Notez également que votre navigateur se bloque pendant le traitement de ces requêtes ;
              soyez patient et vérifiez la barre de progression du navigateur. N'effectuez pas
              d'opérations longues sur plusieurs bourreaux afin d'éviter des expirations.
            </p>
          tunnel_html: |
            <p class="dropmenu_info">
              Le tunnel est le principal canal de communication entre le portail
              et le serveur distant sur lequel le bourreau est configuré. Il est
              nécessaire pour le bourreau et les Task Workers. Démarrer le
              tunnel marquera le bourreau comme « en ligne » dans la base de données.
              Notez que vous pouvez aussi démarrer le tunnel avec le bouton « Démarrer le bourreau ».
              Envisagez de démarrer uniquement le tunnel pour vérifier que les paramètres réseau
              sont valides (par ex. pour vérifier les noms d'hôte, les ports, les pare‑feu, etc.).
            </p>
          execution_server_html: |
            <p class="dropmenu_info">
              Le bourreau nécessite le tunnel mentionné ci‑dessus. Par commodité,
              si le tunnel n'est pas démarré, démarrer le bourreau lancera d'abord le tunnel.
            </p>
          start_task_workers_description_html: |
            <p class="dropmenu_info">
              Les Task Workers nécessitent que le tunnel et le bourreau soient opérationnels.
            </p>
          start_activity_workers_description_html: |
            <p class="dropmenu_info">
              Les Activity Workers sont les seules services pouvant également être démarrés ou arrêtés
              sur les portails. Sur les portails, les Workers ne requièrent aucune des autres couches ci‑dessus.
              Sur les bourreaux, ces Workers nécessitent à la fois le tunnel et le bourreau en fonctionnement.
            </p>

      stop_services:
        processing_in_orange_text: "Éléments en cours indiqués en orange"
        processing: "en tratitement"
        not_safe: "risqué"
        paragraphs:
          stop_services_description_html: |
            <p class="dropmenu_info">
              Ces boutons arrêtent les différentes couches de services associées à un bourreau. Elles sont listées dans le même ordre dans lequel elles doivent être arrêtées. Les trois derniers boutons ne s'appliquent qu'aux bourreaux, tandis que <strong>Arrêter les Activity Workers</strong> s'applique à la fois aux bourreaux et aux portails.
            </p>
            <p class="dropmenu_info">
              Reportez‑vous aux quatre dernières colonnes du tableau pour savoir quels services sont actuellement opérationnels. Les quatre boutons de ce panneau leur correspondent dans l'<em>ordre inverse</em> (de droite à gauche).
            </p>
            <p class="dropmenu_info">
              Notez que l'arrêt des Workers (quel que soit leur type) consiste à leur demander de s'arrêter proprement. S'ils sont en train de %{processing} quelque chose, ils finiront d'abord leur traitement. Les deux dernières colonnes du tableau indiquent s'ils sont actuellement occupés avec le mot %{html_colorize_text}. Dans certains cas, l'arrêt des Workers peut prendre du temps. Actualiser cette page indiquera quand ils sont arrêtés, mais gardez à l'esprit que le contenu de la page n'est normalement mis à jour que toutes les 30 secondes.
            </p>
            <p class="dropmenu_info">
              Notez également que votre navigateur se bloque pendant le traitement de ces requêtes ; soyez patient et vérifiez la barre de progression du navigateur. N'effectuez pas d'opérations longues sur plusieurs bourreaux afin d'éviter des expirations.
            </p>
          stop_activity_workers_description_html: |
            <p class="dropmenu_info">
              Les Activity Workers peuvent s'exécuter à la fois sur les portails et sur les bourreaux. Les arrêter leur enverra un signal pour terminer leurs actions en cours, puis quitter.
            </p>
          stop_task_workers_description_html: |
            <p class="dropmenu_info">
              Arrêter les Task Workers leur enverra un signal pour terminer ce qu'ils sont en train de faire, puis quitter. Cela peut prendre un certain temps.
            </p>
          stop_execution_server_description_html: |
            <p class="dropmenu_info">
              Arrêter un bourreau arrêtera également les Task Workers <strong>et</strong> les Activity Workers qui y fonctionnent. Assurez‑vous qu'ils ne sont pas en train de %{processing} quelque chose.
            </p>
          stop_tunnels_description_html: |
            <p class="dropmenu_info">
              Rappelez‑vous qu'il est %{not_safe} d'arrêter les tunnels si des Workers sont actuellement en train de %{processing} quelque chose.
            </p>

