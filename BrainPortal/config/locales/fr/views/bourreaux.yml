        system_from_email: "Si défini, les messages envoyés automatiquement par ce système contiendront cette adresse de retour."
        cms_shared_dir_html: "Obligatoire. Ce répertoire doit être visible et modifiable depuis tous les nœuds.<br />C'est ici que seront créés les sous-répertoires de travail pour toutes les tâches."
        cms_default_queue: "Optionnel."
        cms_extra_qsub_args: "Optionnel. Attention : ceci est inséré tel quel dans la ligne de commande de soumission des jobs."
        dp_cache_warning: "Attention ! Modifier ce champ réinitialisera le statut de synchronisation de tous les fichiers de tous les Data Providers ! De plus, l'application Rails devra être redémarrée et tous les fichiers de ce répertoire seront effacés !"
        ignore_patterns: "Séparez plusieurs motifs par des espaces ; chaque motif peut contenir des '*' simples, mais pas de '/' ni de caractères spéciaux."
        name_note_bourreau_html: "Remarque importante : ce nom doit également être modifié en conséquence dans le fichier de configuration <em>Bourreau/config/initializers/config_bourreau.rb</em> pour que ce serveur puisse redémarrer correctement par la suite."
        name_note_portal_html: "Remarque importante : ce nom doit également être modifié en conséquence dans le fichier de configuration <em>BrainPortal/config/initializers/config_portal.rb</em> pour que ce serveur puisse redémarrer correctement par la suite."
        license_agreements: "Saisissez un nom de licence par ligne. Notez que seuls les caractères alphanumériques, les underscores (_) et les tirets (-) sont acceptés."
        external_status_page: "Lien vers la page d'état externe du serveur."
        user_manual_url: "Si défini, le portail affichera un lien appelé 'Manuel utilisateur' dans la barre de compte en haut."
        base_portal_url_html: "Requis pour diriger les nouveaux utilisateurs vers le portail, ceci doit être rempli avec l'URL <em>de base</em> du portail"
        neurohub_base_url_html: "Requis pour diriger les nouveaux utilisateurs vers le portail NeuroHub, ceci doit être rempli avec l'URL <em>de base</em> du portail"
        large_upload_url: "Si défini, le portail affichera un lien intitulé « Datasets volumineux? » dans le panneau d'upload, renvoyant les utilisateurs vers une page personnalisée où vous pouvez fournir des explications pour des méthodes alternatives d'upload."
        upload_size_limit: "Si défini (et numérique), le portail affichera un avertissement lors du téléchargement de fichiers sur la taille maximale autorisée pour les uploads. Notez que cette limite doit être appliquée manuellement sur le serveur web hébergeant ce portail."
        support_email_html: "Si défini, le portail affichera un lien <em>mailto:</em> permettant aux utilisateurs de contacter le support."
        nh_support_email_html: "Si défini, le portail affichera un lien <em>mailto:</em> permettant aux utilisateurs de contacter le support NeuroHub."
        nh_system_from_email: "Si défini, les messages NeuroHub envoyés automatiquement par ce système contiendront cette adresse de retour."
        activity_workers_explanation_html: "En environnement de développement %{env_note} un seul Activity Worker suffit souvent. En production, un portail occupé peut nécessiter plus d'un Worker, mais un bourreau peut fonctionner correctement avec un seul."
        cache_expiration_html: "Cela signifie que, dans le cache du bourreau, les fichiers marqués comme 'InSync' mais dont le dernier accès remonte à plus de ce délai seront considérés comme non fiables et seront resynchronisés lors du prochain accès. Réglez ceci sur une valeur inférieure à <em>N</em> si la politique de fichiers du cluster supprime par exemple tous les fichiers temporaires âgés de plus de <em>N</em> jours."
        docker_executable_name: "Nom de l'exécutable Docker disponible sur les machines où les tâches s'exécuteront. Il doit toujours être défini si Docker est présent."
        singularity_executable_name: "Nom de l'exécutable Singularity disponible sur les machines où les tâches s'exécuteront. Il doit toujours être défini si Singularity est présent."

      all_admins: "Tous les admins"

      paragraphs:
        reverse_service_description_html: "Ceci est un mécanisme alternatif pour fournir au Bourreau une connexion distincte à la base de données et à l'agent SSH. Pour que cela fonctionne, un serveur accessible en SSH (fourni par nom d'hôte, numéro de port et nom d'utilisateur) doit être configuré pour accepter la clé principale du portail CBRAIN, et être visible depuis le Bourreau. Ce serveur doit disposer d'un agent SSH fournissant des clés sur un socket de domaine UNIX, et d'une connexion de base de données pour CBRAIN. La spécification de la connexion à la base de données peut être fournie soit comme chemin complet vers un socket de domaine UNIX, soit comme <em>localhost:port</em>."
        reverse_service_defaults_html: "Certaines <strong>valeurs par défaut</strong> affichées sous les zones de saisie sont des <em>estimations</em> basées sur le portail actuellement en cours d'exécution. Elles sont utiles si le portail est justement le serveur vers lequel se reconnecter."
        persistent_ssh_explanation: "Lorsqu'il est réglé sur 'toujours', les connexions SSH vers l'hôte d'un data provider persistent après la première utilisation. Cela rend les transferts de données successifs un peu plus rapides car la connexion n'a pas besoin d'être rouverte à chaque fois. Le comportement par défaut est activé ('toujours') pour les portails et désactivé ('jamais') pour les bourreaux."

