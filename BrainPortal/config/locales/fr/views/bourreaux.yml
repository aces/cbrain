        scir_sharcnet: "Sharcnet custom"
        scir_lsf: "LSF"
        scir_slurm: "SLURM"
        scir_gcloud_batch: "Google Cloud"
        scir_unix: "Processus UNIX"

      divs:
        name_html: |
          <div class="field_explanation">
            Remarque importante : ce nom doit également être modifié en conséquence dans le fichier de configuration
            <em>Bourreau/config/initializers/config_bourreau.rb</em>
            pour que ce serveur puisse redémarrer correctement par la suite.
          </div>
        system_from_email_html: |
          <div class="field_explanation">
            Si défini, les messages envoyés automatiquement par ce système contiendront cette adresse de retour.
          </div>
        description_html: |
          <div class="field_explanation">
            La première ligne doit être un résumé court, le reste servant pour des notes particulières destinées aux utilisateurs.
          </div>
        dp_cache_dir_html: |
          <div class="field_explanation">
            Attention ! Modifier ce champ réinitialisera le statut de synchronisation de tous les fichiers de tous les Data Providers ! De plus, l'application Rails devra être redémarrée et tous les fichiers de ce répertoire seront effacés !
          </div>
        spaced_dp_ignore_patterns_html: |
          <div class="field_explanation">
            Séparez plusieurs motifs par des espaces ; chaque motif peut contenir des '*' simples, mais pas de '/' ni de caractères spéciaux.
          </div>
        cache_trust_expire_html: |
          <div class="field_explanation">
            Cela signifie que, dans le cache du bourreau, les fichiers marqués comme 'InSync' mais dont le dernier accès remonte à plus de ce délai seront considérés comme non fiables et seront resynchronisés lors du prochain accès. Réglez ceci sur une valeur inférieure à <em>N</em> si la politique de fichiers du cluster supprime par exemple tous les fichiers temporaires âgés de plus de <em>N</em> jours.
          </div>
        cms_shared_dir_html: |
          <div class="field_explanation">
            Obligatoire. Ce répertoire doit être visible et modifiable depuis tous les nœuds.
            C'est ici que seront créés les sous-répertoires de travail pour toutes les tâches.
          </div>
        cms_default_queue_html: |
          <div class="field_explanation">
            Optionnel.
          </div>
        cms_extra_qsub_args_html: |
          <div class="field_explanation">
            Optionnel. Attention : ceci est inséré tel quel dans la ligne de commande de soumission des jobs.
          </div>
        workers_verbose_html: |
          <div class="field_explanation">
            Cette option n'a aucun effet si les logs sont envoyés dans le log RAILS.
          </div>

