        notes: "Quelques remarques sur ce jeton"
        copy_tooltip: "Cliquez sur ce bouton pour copier le jeton API dans le presse-papiers"
      paragraphs:
        generated_intro: "Un nouveau jeton API vient d'être généré pour vous."
        token_html: |
          Si vous êtes développeur et souhaitez automatiser des interactions
          avec CBRAIN ou NeuroHub, ce jeton sera nécessaire pour accéder aux API.
          <p>
          Reportez-vous à la documentation de l'API CBRAIN
          pour plus d'informations.
          <p>
      labels:
        copy: "copier"
      li:
        validity: "Ce jeton ne sera valide que pendant %{duration}."
        renewal: "Chaque fois qu'une requête est faite avec ce jeton, il devient valide pour une nouvelle période de %{duration}."
        ip_lock_html: "La première fois qu'il est utilisé, l'adresse IP du client connecté sera<br />enregistrée et seules les connexions depuis cette adresse IP seront valides."
        ip_invalid_html: "Si une connexion ultérieure provient d'une autre adresse IP à un moment quelconque,<br />le jeton sera immédiatement invalidé."
        copy_html: "Pour copier le jeton dans votre presse-papiers, cliquez simplement sur le bouton « copier » situé à droite du jeton. Le jeton sera enregistré dans votre presse-papiers.<br />N'oubliez pas de le coller et de le sauvegarder : vous ne pourrez pas le voir à nouveau."

