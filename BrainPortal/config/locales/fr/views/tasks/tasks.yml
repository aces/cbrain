      paragraphs:
        parameters_description_html: |
          <p class="medium_paragraphs">
           Ceci affiche uniquement les paramètres scientifiques associés à
           cette tâche. Consultez la description du dernier panneau pour plus
           d'informations.
          </p>
        parameters_in_json: |
          <p class="medium_paragraphs">
           Ceci affiche uniquement les paramètres scientifiques associés à
           cette tâche. Consultez la description du dernier panneau pour plus
           d'informations.
          </p>
        full_task_object_in_json_html: |
          <p class="medium_paragraphs">
            Cette structure affiche la quantité minimale d'informations nécessaires
            pour créer une tâche CBRAIN similaire à celle-ci à l'aide de l'API CBRAIN.
            Elle est fournie pour aider les développeurs qui travaillent avec l'API. Le niveau
            supérieur contient les ID des ressources CBRAIN nécessaires pour la tâche
            (p. ex. l'ID du groupe (projet), l'ID de l'utilisateur, la version de l'
            outil, etc.). Ce sont les valeurs que vous voyez en haut de la page dans
            la section <em>Info</em>.
          </p>
          <p class="medium_paragraphs">
            Les informations sous <strong>"params"</strong> correspondent exactement à ce
            qui est affiché dans l'onglet précédent. Elles contiennent généralement les paramètres
            scientifiques de l'outil, où les noms de fichiers sont remplacés par les ID des
            fichiers enregistrés dans CBRAIN.
          </p>
          <p class="medium_paragraphs">
            Pour les outils intégrés à
            <a href="https://github.com/boutiques/boutiques" target="_blank">Boutiques</a>,
            la structure <strong>"params"</strong> contient une sous-structure appelée
            <strong>"invoke"</strong> dans laquelle la plupart des paramètres scientifiques sont
            déplacés. Cette structure doit correspondre exactement à la structure invoke attendue
            par le programme <em>bosh</em> de Boutiques, mais encore une fois avec les noms de fichiers
            remplacés par les ID des fichiers CBRAIN.
          </p>
          <p class="medium_paragraphs">
            Notez que certaines clés et valeurs sont ajoutées à ces structures pendant ou
            à la fin du traitement et ne sont pas requises au moment où la tâche est
            soumise.
          </p>

