          Thank you. You've confirmed your email address.
          <p>
          Now it's up to the administrators to review your request
          and you'll be notified if and when they approve it.
          <p>
        propose_view_html: |
          In the meantime you can %{look} at your request, or even %{edit} it.
        footer: |
          (There is nothing else to do here, you might as well have a coffee and read the news)

