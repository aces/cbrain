en:
  sessions:

    mandatory_oidc:
      title: "Mandatory Identity provider Link"
      headings:
        before_message_html: "Before you can continue, your CBRAIN account <em>must</em> be linked to an identity provider."
        explanations: "Explanations"
        allowed_providers: "The identity providers that are allowed for your account are:"

      paragraphs:
        explanations: |
          <p class="short_paragraphs">
          When you click on the button below, your browser will be redirected
          to an identity provider login page; from there you can choose one of the
          supported identity providers. This will in turn redirect you
          to the provider's own login page. Once you've successfully authenticated
          there, your browser will be redirected back here to finalize
          the link with your CBRAIN account.
          </p>
        no_provider: |
          <p class="short_paragraphs">
          No identity provider is currently available for your account.
          Please contact the CBRAIN administrator for more information.
          </p>
        already_logged_in: |
          <p class="short_paragraphs">
          If you already are logged in using a different identity provider, you
          might want to log out first. This can be accomplished by the button below:
          </p>

      any_provider: "(Any identity provider)"

      links:
        login_with: "Login with %{name}"
        logout_from: "Logout from %{name}"

    new:
      title: "Login"

      divs:
        only_available_html: |
          <div class="field_explanation">
            (Only available if you have already linked your<br>
            CBRAIN account to a %{name} identity)
          </div>
      labels:
        login: "Login"
        password: "Password"

      submit:
        sign_in: "Sign in"

      links:
        forgot_password: "Forgot your password?"
        sign_in_with: "Sign In With %{name}"
        request_account: "Request an account."
        full_list: "Full list of all tools and datasets"

      or: "OR"
      not_a_user: "Not a user?"
