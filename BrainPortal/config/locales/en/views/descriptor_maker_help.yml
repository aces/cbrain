en:
  descriptor_maker_help:
    title: "Boutiques Descriptor Maker"
    intro: "This form allows you to design and visualize a Boutiques descriptor for a task."
    syntax: "The descriptor is in JSON format and the syntax is very strict."
    sample: "You start with a sample descriptor with five example inputs (a file, a string, a number, a flag and a selection box)."
    check_html: "Add new inputs and metadata as needed, and click on the <strong>Check Descriptor</strong> button to refresh this page and validate the descriptor."
    validation_html: "If the descriptor’s syntax is valid, it will be re-validated by <em>bosh</em> and messages will be shown below. If this validation step works too, an example of the generated command will be shown, based on the content of the generated form underneath."
    values_html: "You can enter values in the generated form to see their effects on validation and the command line. <strong>Note:</strong> because the form shows inputs from the previous check, you may have to click <strong>Check Descriptor</strong> twice to synchronize the posted form data with the descriptor’s inputs."
    reset: "At any time, you can return to the initial example descriptor by clearing the entire JSON descriptor text area."
    recommendations: "Recommendations"
    name: "Enter a proper tool name without spaces or special characters, e.g. \"Brainmangler\" or \"SuperConfabulator\"."
    version: "The 'tool-version' field also needs a proper string value."
    author: "The 'author' and 'descriptor-url' fields identify the tool’s author. Enter your own name in the custom → 'cbrain:author' section instead."
    more: "More information"
    spec_html: "The full Boutiques specification is available at %{link}."
    resources: "Other resources:"
    schema: "Full JSON schema"
    examples: "Examples"
    schema_source_html: "%{link} from the Boutiques project itself."
    examples_source_html: "%{link} from the Boutiques project."
    traditional_html: "%{link} from the CBRAIN Neuro plugins, with traditional descriptors."
    extensions_html: "%{link} from the CBRAIN Neuro plugins, with extra CBRAIN behavior extensions."
