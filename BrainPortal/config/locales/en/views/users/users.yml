        ip_invalid_html: "If a subsequent connection comes from any other IP address at any time,<br />the token will immediately be invalidated."
        copy_html: "To copy the token to your clipboard, simply click the copy button located to the right of the token. The token will be saved to your clipboard.<br />Please do not forget to paste and save the token. You will not be able to see it again."

