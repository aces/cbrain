          <div class="field_explanation">
            The first line should be a short summary, and the rest are for details.
          </div>
        invisible_html: |
          <p>
          Make this a system group invisible to normal users:
        track_usage_html: |
          <p>
          Turn on usage tracking for files in this project:
        not_assignable_html: |
          <p>
          Normal members will not be able to assign files or other resources
          to this project (but editors are always allowed to do so):
        public_html: |
          <p>
          Make the project public, so that all users can access the files. Be careful with this option! You can always make the project public later on:
      prompts:
        site: "(Select a site)"
      submit: "Create"

    show:
      title: "Project Info"
      titles:
        project_log: "Project Log"
      links:
        leave_project: "Leave Project"
        invite: "Invite Other Users"
        remove: ": Remove"
      headings:
        message_1: "Project could not be updated."
        message_2: "Urls are clickable "
        message_3: "Assigned To Access Profiles"
        creator: "Maintainer"
        resources: "Resources"
        members: "Members"
        pending_invitations: "Pending Invitations"
      cells:
        type: "Type"
        invisible: "Invisible"
        userfiles: "Files"
        tasks: "Tasks"
        tools: "Tools"
        data_providers: "Data Providers"
        portal: "Portal"
        execution: "Execution"
        members: "Members"
        track_usage: "Track Usage"
        not_assignable: "Not Assignable"
        public: "Public"
      paragraphs:
        creator_html: |
          <div class="field_explanation">
            <span class="warning">Warning</span>: If you change the maintainer to someone else you won't be able to edit this project any more
          </div>
        description_html: |
          <div class="field_explanation">
            The first line should be a short summary, and the rest are for details.
          </div>
        not_assignable_html: |
          <div class="field_explanation">
            If checked, normal members will not be able to assign files or other
            resources to this project (but editors are always allowed to do so).
          </div>
        public_html: |
          <div class="field_explanation">
            If checked, a public project makes all its files visible to all the users. <span class="warning">Be careful </span>
            with this option!
          </div>
        invisible_html: |
         <div class="field_explanation">
            If checked, the project will not be shown in the list of projects.
          </div>
        track_usage_html: |
          <div class="field_explanation">
            If checked, the system will track overall usage of files in this project
            (views, downloads etc) per month.
          </div>
