    show_cpu_quota:
      titles:
        create: "Create CPU Quota"
        edit: "Edit CPU Quota"
        log: "CPU Quota Record Log"
      links:
        cpu_quotas_table: "CPU Quotas Table"
        new_cpu_quota: "New CPU Quota"
      headings:
        record: "CPU Quota Record"
        max_cpu_week: "Max CPU time past week"
        max_cpu_month: "Max CPU time past month"
        max_cpu_total: "Max CPU time in total"
        max_active_tasks: "Max Active Tasks"
      cells:
        user: "User"
        project: "Project"
        execution_server: "Execution Server"
      blanks:
        any_project: "(Any Project)"
        any_execution_server: "(Any Execution Server)"
        default_all_users: "(Default for all Users)"
      divs:
        user_html: |
          <div class="field_explanation">
            You can leave the user field blank and instead specify a project, below.
            You can also leave them both blank.
          </div>
        project_html: |
          <div class="field_explanation">
            Instead of specifying a user, above, you can select a project, and the quota
            will apply to all users of that project. User and Project are mutually exclusive
            in a CPU quota. You can also leave them both blank.
          </div>
        execution_server_html: |
          <div class="field_explanation">
            You can leave this blank, but then you must provide either a user or a project, above.
          </div>
        max_cpu_past_week_html: |
          <div class="field_explanation">
            The limit CPU time is in seconds; when entering a new value,
            you can use a unit as a suffix, such as in
            <em>3.5h</em> (hours), <em>7d</em> (days), <em>4w</em> (weeks),
            <em>3m</em> (months) and <em>1y</em> (years).
            There are no suffixes for seconds and minutes.
            A value of <em>0</em> means no time is allowed at all.
          </div>
        max_cpu_past_month_html: |
          <div class="field_explanation">
            See the explanations for Max CPU time past months.
          </div>
        max_cpu_ever_html: |
          <div class="field_explanation">
            See the explanations for Max CPU time past week.
          </div>
        max_active_tasks_html: |
          <div class="field_explanation">
            The maximum number of tasks that can be active at any given time on the Execution Server.
            Leave blank to not set a limit. A value of zero will prevent any tasks from being launched.
            Note that projects are ignored for these values, and that if several quota records apply
            to a user and differ only by project, the minimum value found in that set will be used.
            The core Admin account is used to set a maximum number of tasks IN TOTAL for an Execution
            server (thus, no limit specific to that admin user can be specified here).
          </div>

    show_disk_quota:
      titles:
        create: "Create Disk Quota"
        edit: "Edit Disk Quota"
        log: "Disk Quota Record Log"
      links:
        disk_quotas_table: "Disk Quotas Table"
        new_disk_quota: "New Disk Quota"
        new_quota_same_provider: "New Quota With Same Provider"
        new_quota_same_user: "New Quota With Same User"
      headings:
        record: "Disk Quota Record"
        max_disk_space: "Max Disk Space"
        max_num_files: "Max Number Of Files"
      columns:
        user: "User"
        data_provider: "Data Provider"
      blanks:
        default_all_users: "(Default for all Users)"
        select_data_provider: "(Select a DataProvider)"
      divs:
        max_bytes_html: |
          <div class="field_explanation">
            Sizes are in bytes; when entering a new value,
            you can use a unit as a suffix, such as in <em>2.3 kb</em> and <em>10 G</em>.
            A value of <em>0</em> means no files allowed at all.
          </div>
        max_files_html: |
          <div class="field_explanation">
            A value of <em>0</em> means no files allowed at all.
          </div>

    index:
      title: "%{mode} Quotas Configurations"
      mode:
        disk: "Disk"
        cpu: "CPU"
      about: "About"
      links:
        exceeded_report: "Exceeded %{mode} Quotas Report"
        new_entry: "New %{mode} Quota Entry"
        to_disk: "Switch to Disk Quotas"
        to_cpu: "Switch to CPU Quotas"
      legends:
        about_disk: "About Disk Quotas"
        about_cpu: "About CPU Quotas"
      paragraphs:
        disk_quota_explanations_html: |
          <p class="long_paragraphs">
          This page shows the limits for the amount of disk space and number
          of files that can be stored on each DataProvider. Each row is
          a quota entry that applies to a user or all users, for a particular
          DataProvider. When a user exceeds the one of the two limits for
          a DataProvider, the user will no longer be able to create new
          files.
        cpu_quota_explanations_html: |
          <p class="long_paragraphs">
          This page shows the limits for the amount of CPU processing time
          that a user can historically accumulate. There are three rolling
          windows: for the CPU time accumulated over the past week, over
          the past month, and over the entire lifetime of the user's account.
          <p class="long_paragraphs">
          Each row contains a quota entry with all three limits. Quotas
          can apply to one or several Execution Servers, and can apply to
          a single specific user, all users, or all the users of a particular
          project.
          <p class="long_paragraphs">
          When a user has exceeded their quota on an Execution Server, their
          tasks in status 'New' will not be set up, and they will stay in 'New'
          until the quota window has moved ahead far enough to free some time.
